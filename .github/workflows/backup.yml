name: Sauvegarde de la base

# Chaque nuit (et à la demande) : copie de la base Supabase (rôles, structure, données, comptes),
# chiffrée avant de quitter la machine, gardée 30 jours dans les artefacts du workflow. Le dépôt est
# public : sans la phrase secrète, la copie est illisible.
#
# Secrets nécessaires : SUPABASE_ACCESS_TOKEN et BACKUP_PASSPHRASE (une longue phrase, à garder aussi
# ailleurs : sans elle, impossible de relire une sauvegarde).
# Restaurer : télécharger l'artefact, puis
#   gpg --decrypt sauvegarde.tar.gz.gpg | tar xz
# et rejouer roles.sql, schema.sql puis data.sql sur une base vide (psql).

on:
  schedule:
    - cron: '17 2 * * *' # 2 h 17 UTC, chaque nuit
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: wyawthtpqybhejlkaolt
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phrase secrète présente ?
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Ajoute le secret BACKUP_PASSPHRASE (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Copie de la base
        run: |
          mkdir -p dump
          supabase db dump --linked --role-only -f dump/roles.sql
          supabase db dump --linked -f dump/schema.sql
          supabase db dump --linked --data-only --use-copy -s public,auth,storage -f dump/data.sql
          ls -la dump
      - name: Chiffrement
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar czf - -C dump . | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 -o sauvegarde.tar.gz.gpg 3<<<"$BACKUP_PASSPHRASE"
          rm -rf dump
          ls -la sauvegarde.tar.gz.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ github.run_number }}
          path: sauvegarde.tar.gz.gpg
          retention-days: 30
